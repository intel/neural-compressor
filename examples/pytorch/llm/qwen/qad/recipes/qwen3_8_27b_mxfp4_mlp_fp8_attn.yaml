# Qwen3.8-27B full QAD: MXFP4 W4A4 MLP + static FP8 attention/GDN.
# The reference recipe is `mxfp4_w4a4_mlp_fp8_attn_mcore_dynamic`:
# https://github.com/NVIDIA/TensorRT-Model-Optimizer/blob/main/modelopt_recipes/models/Qwen/Qwen3.8-27B/ptq/mxfp4_w4a4_mlp_fp8_attn_mcore_dynamic.yaml
# To use an existing PTQ amax source, pass `--amax-source <summary-or-json>` to main.py.
schema: neural_compressor.qad/v1
name: qwen3_8-27b-mxfp4-mlp-fp8-attn

model:
  path: Qwen/Qwen3.8-27B
  family: qwen3_5
  dtype: bfloat16

quant:
  algorithm: max
  # default=None => everything off; only the rules below are quantized.
  rules:
    - module: '.*\.mlp\.(gate_proj|up_proj|down_proj)$'
      weight: {format: mxfp4}
      input: {format: mxfp4}
    - module: '.*\.(self_attn|linear_attn)\.(q_proj|k_proj|v_proj|o_proj|in_proj_qkv|in_proj_z|out_proj)$'
      weight: {format: fp8_e4m3, scheme: static}
      input: {format: fp8_e4m3, scheme: static}
  # Use exact fp32 amax from PTQ calibration when --amax-source is provided.
  # Otherwise main.py calibrates on a single rank before distributed training.

distill:
  teacher: Qwen/Qwen3.8-27B
  loss: topk_kl
  top_k: 4096
  temperature: 1.0
  kd_weight: 1.0
  ce_weight: 0.0
  chunk: 1024
  teacher_device: shard

train:
  backend: hf
  parallel: fsdp2
  seq_length: 8192
  micro_batch_size: 1
  global_batch_size: 16
  train_iters: 4000
  lr: 2.0e-6
  min_lr: 2.0e-7
  warmup: 50
  weight_decay: 0.1
  clip_grad: 1.0
  adam_beta2: 0.95
  adam_eps: 1.0e-8
  seed: 42   # matches the formal 8xH200 run (training_args.bin)
  gradient_checkpointing: true
  gc_mode: trainer
  save_steps: 500
  logging_steps: 1

export:
  format: hf_bf16
  keep_vision: true
