# Qwen3.5 / Qwen3.8-27B Low-Memory Full QAD (< 82 GiB/GPU on 4x-8x 80GB/96GB GPUs)
# Combines FSDP2 parameter/optimizer CPU offload, FSDP2 activation checkpointing,
# fused zero-temp-VRAM Triton QDQ kernels, and 1024-token chunked Top-K KL distillation.
model_name_or_path: Qwen/Qwen3.8-27B
model_dtype: bfloat16

quant:
  backend: auto
  config_groups:
    - targets: ['re:.*\.mlp\.(gate_proj|up_proj|down_proj)$']
      weights: {format: mxfp4, dynamic: true}
      input_activations: {format: mxfp4, dynamic: true}
    - targets: ['re:.*\.(self_attn|linear_attn)\.(q_proj|k_proj|v_proj|o_proj|in_proj_qkv|in_proj_z|out_proj)$']
      weights: {format: fp8_e4m3, dynamic: false}
      input_activations: {format: fp8_e4m3, dynamic: false}
  ignore: ['lm_head', 're:.*mlp\.gate$']

calib_batches: 32

# Distillation (teacher_model_name_or_path defaults to model_name_or_path when omitted)
teacher_placement: shard
kd_loss_type: topk_kl
kd_top_k: 4096
kd_temperature: 1.0
kd_reverse_kl: false
kd_loss_weight: 1.0
ce_loss_weight: 0.0
logits_chunk_size: 1024

# Low-Memory HF TrainingArguments + FSDP2 CPU Offload
bf16: true
seq_length: 8192
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
max_steps: 4000
learning_rate: 2.0e-6
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr: 2.0e-7
warmup_steps: 50
weight_decay: 0.1
max_grad_norm: 1.0
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-8
seed: 1234
logging_steps: 1
save_strategy: steps
save_steps: 500
save_total_limit: 2
fsdp: "full_shard offload auto_wrap"
fsdp_config:
  fsdp_version: 2
  reshard_after_forward: true
  cpu_offload: true
  activation_checkpointing: true
  state_dict_type: SHARDED_STATE_DICT
  transformer_layer_cls_to_wrap:
    - Qwen3_5DecoderLayer

export_format: compressed_tensors
keep_vision_on_export: true
