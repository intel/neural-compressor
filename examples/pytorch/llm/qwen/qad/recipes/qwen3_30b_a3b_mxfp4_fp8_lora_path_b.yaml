# Qwen3-30B-A3B (30.5B Total / 3.3B Active, 48 Layers, 128 Experts, Top-8)
# MXFP4 + FP8 Hybrid QAD with Fused 3D `QuantFusedMoEExperts` + Self-Teacher Path-B LoRA
model_name_or_path: /mnt/weka/hf_home/hub/models--Qwen--Qwen3-30B-A3B/snapshots/ad44e777bcd18fa416d9da3bd8f70d33ebb85d39
model_dtype: bfloat16

quant:
  preset: qwen3_5_mxfp4_hybrid
  backend: auto

calib_batches: 4

# Path-B LoRA across both 2D Attention and 3D Fused MoE Experts (`gate_up_proj`, `down_proj`)
use_lora: true
lora_r: 16
lora_alpha: 16
lora_dropout: 0.0
lora_merge_before_quant: true
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_up_proj
  - down_proj

# Zero-VRAM Self-Teacher Distillation
teacher_model_name_or_path: self
teacher_placement: self
kd_loss_type: topk_kl
kd_top_k: 4096
kd_temperature: 1.0
kd_loss_weight: 1.0
ce_loss_weight: 0.0
logits_chunk_size: 1024

# HF TrainingArguments + 4-GPU FSDP2
bf16: true
seq_length: 1024
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
max_steps: 20
learning_rate: 1.0e-4
lr_scheduler_type: cosine
warmup_steps: 2
weight_decay: 0.0
max_grad_norm: 1.0
seed: 42
logging_steps: 1
save_strategy: "no"
fsdp: "full_shard auto_wrap"
fsdp_config:
  fsdp_version: 2
  reshard_after_forward: true
  activation_checkpointing: true
  transformer_layer_cls_to_wrap:
    - Qwen3MoeDecoderLayer

export_format: bf16_qdq
